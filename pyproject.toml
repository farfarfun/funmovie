[project]
name = "funmovie"
version = "0.0.5"
description = "BitTorrent DHT 磁力链接采集、迅雷链接转磁力、本地存储（SQLite/Redis）与 aria2c 下载、种子元信息解析工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tqdm>=4.66.0",
    "redis>=5.0.0",
    # PyPI 上的 `bencoder`（0.2.0）只提供 encode/decode API，代码实际用的
    # bencode/bdecode 由同 import 名下的另一个发行版 `bencoder.pyx` 提供
    "bencoder.pyx>=3.0.0",
    "farlog>=1.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funmovie"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
